version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-iq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    env_file:
      - .env
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-iq-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/resumeiq
      - REDIS_URL=redis://redis:6379
      - UPLOAD_DIR=/app/uploads
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume-iq-worker
    restart: unless-stopped
    command: npm run worker:prod
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/resumeiq
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:6
    container_name: resume-iq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: resume-iq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mongodb_data:
